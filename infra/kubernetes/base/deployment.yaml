apiVersion: apps/v1
kind: Deployment
metadata:
  name: sigmun-backend
  labels:
    app: sigmun
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sigmun
      component: backend
  template:
    metadata:
      labels:
        app: sigmun
        component: backend
    spec:
      containers:
        - name: backend
          image: sigmun/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: sigmun-config
            - secretRef:
                name: sigmun-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: sigmun-backend
  labels:
    app: sigmun
    component: backend
spec:
  selector:
    app: sigmun
    component: backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
