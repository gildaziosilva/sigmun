name: CI - Continuous Integration

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    # Credenciais do PostgreSQL do service container, consumidas via
    # pydantic-settings (DB_*) pelo alembic e pelos testes de integração.
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: sigmun
      DB_USER: sigmun
      DB_PASSWORD: sigmun
      # T-1.2: SECRET_KEY válida p/ testes (Fase 0 exige chave real no startup).
      SECRET_KEY: ci-test-secret-key-0123456789abcdef-ci-only
      APP_ENV: test

    services:
      postgres:
        # Versão alinhada ao docker-compose local (postgres:15) para
        # paridade entre CI e desenvolvimento.
        image: postgres:15-alpine
        env:
          POSTGRES_DB: sigmun
          POSTGRES_USER: sigmun
          POSTGRES_PASSWORD: sigmun
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessário para diff de openapi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock

      - name: Apply database migrations
        run: alembic upgrade head

      # T-1.2: testes ANTES de lint/mypy — a suíte verde tem valor imediato
      # e não fica bloqueada pelos gates estáticos (zerados em T-1.3/T-1.4).
      - name: Run tests
        run: pytest tests/ -q --cov=src --cov-report=xml --cov-fail-under=80 --ignore=tests/e2e

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with mypy
        run: mypy src/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # T-3.3: OpenAPI versionado + gate de diff
  openapi:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Gerar openapi.json versionado
        run: |
          # Usa tag do git se existir, senão timestamp
          VERSION=$(git describe --tags --exact-match 2>/dev/null || date +%Y%m%d-%H%M%S)
          python scripts/gerar_openapi.py --version "$VERSION"

      - name: Diff OpenAPI (breaking changes gate)
        run: |
          # Compara com a versão anterior (latest) se existir
          if [ -f openapi/latest/openapi.json ]; then
            python scripts/diff_openapi.py --base openapi/latest/openapi.json --head openapi/v$VERSION/openapi.json
          else
            echo "Sem versão anterior para comparar (primeira geração)"
          fi

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-${{ github.sha }}
          path: openapi/
          retention-days: 30

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, portal-cidadao, portal-fornecedor]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Install frontend deps
        working-directory: frontend/${{ matrix.app }}
        run: npm ci

      - name: Lint frontend
        working-directory: frontend/${{ matrix.app }}
        run: npm run lint

      - name: Test frontend
        working-directory: frontend/${{ matrix.app }}
        run: npm run test -- --run

      - name: Build frontend
        working-directory: frontend/${{ matrix.app }}
        run: npm run build

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker image
        run: |
          docker build -t sigmun-backend:latest -f infra/docker/backend/Dockerfile .
