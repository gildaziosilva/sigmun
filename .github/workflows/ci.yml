name: CI - Continuous Integration

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    # Credenciais do PostgreSQL do service container, consumidas via
    # pydantic-settings (DB_*) pelo alembic e pelos testes de integração.
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: sigmun
      DB_USER: sigmun
      DB_PASSWORD: sigmun

    services:
      postgres:
        # Versão alinhada ao docker-compose local (postgres:15) para
        # paridade entre CI e desenvolvimento.
        image: postgres:15-alpine
        env:
          POSTGRES_DB: sigmun
          POSTGRES_USER: sigmun
          POSTGRES_PASSWORD: sigmun
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with mypy
        run: mypy src/

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker image
        run: |
          docker build -t sigmun-backend:latest -f infra/docker/backend/Dockerfile .
